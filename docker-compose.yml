version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "80:80"
    networks:
      - app-network

  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    networks:
      - app-network

networks:
  app-network:
